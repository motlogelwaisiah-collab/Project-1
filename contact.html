<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Durah Deh TopLess</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#2563eb,#7c3aed,#db2777);
background-size:400% 400%;
animation:bg 12s ease infinite;
min-height:100vh;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

nav{
display:flex;
justify-content:center;
gap:25px;
padding:20px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
padding:12px 22px;
border-radius:30px;
transition:.4s;
}

nav a:hover{
background:white;
color:black;
}

.container{
width:420px;
max-width:90%;
margin:60px auto;
background:rgba(255,255,255,.08);
padding:35px;
border-radius:25px;
backdrop-filter:blur(15px);
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

h1{
text-align:center;
margin-bottom:30px;
color:#FFD700;
}

input,textarea{

width:100%;
padding:15px;
margin-bottom:20px;
border:none;
outline:none;
border-radius:10px;
font-size:16px;
}

textarea{
resize:none;
height:150px;
}

button{

width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#FFD700;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.4s;
}

button:hover{

background:white;
transform:scale(1.05);

}

footer{
text-align:center;
padding:25px;
opacity:.8;
}

</style>

</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<div class="container">

<h1>Contact Us</h1>

<form>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<textarea placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

</div>

<footer>
© 2026 Durah Deh TopLess
</footer>

</body>
</html>
